name: gate
on: [push, workflow_dispatch]
jobs:
  witness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: proof-of-play — the one rule a ledger has
        run: node ledger.test.mjs

      # Pinned. An unpinned gate is a gate somebody else can change.
      - name: witness — try to break the tests
        run: |
          git clone --depth 1 --branch v0.3 https://github.com/sjgant80-hub/witness.git /tmp/witness
          node /tmp/witness/witness.mjs mutate ledger.mjs \
            --cap 400 --baseline witness.ledger.baseline.json --test node ledger.test.mjs

      - name: the shipped page still matches the gated kernel
        run: |
          cp index.html /tmp/shipped.html
          node build-page.mjs
          diff -q /tmp/shipped.html index.html || {
            echo "::error::index.html has drifted from ledger.mjs — run build-page.mjs and commit."; exit 1; }

      # ⚑ The balance check must never go back to summing pounds with a tolerance.
      - name: no ungated arithmetic in the posting path
        run: |
          # ⚑ Written as `if grep; then fail; fi`. The `grep -q X && { fail; }` form returns GREP's
          # own status when the pattern is ABSENT, so under `set -e` it fails the step exactly when
          # the code is correct — a guard that fires on success.
          must_have()     { if ! grep -qF "$1" index.html; then echo "::error::$2"; exit 1; fi }
          must_not_match() { if grep -qE "$1" index.html; then echo "::error::$2"; exit 1; fi }

          must_have 'LEDGER.validateJournal' 'postJournal is not using the kernel'

          # ⚑ ANY tolerance, not one spelling of it. This guard looked for `Math.abs(dr-cr)>0.005`
          # while the page contained `Math.abs(dr-cr)<0.005` — one character apart, so it could never
          # match, and the half-penny tolerance sat in the trial balance for months under a step whose
          # own comment says it must never come back.
          must_not_match 'Math\.abs\(dr *- *cr\) *[<>]=? *[0-9]' 'the half-penny tolerance is back in the trial balance'
          must_not_match 'Math\.abs\([a-zA-Z]+ *- *[a-zA-Z]+\) *[<>]=? *0\.[0-9]' 'money is being compared with a tolerance somewhere'

          # And the screen must READ the kernel's verdict rather than recompute one.
          must_have '__trial' 'the trial balance is not reading the kernel verdict'
          must_not_match 'if\(!b\)return;' 'the trial balance is silently dropping lines again'
          echo ok
