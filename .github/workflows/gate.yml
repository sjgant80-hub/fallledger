name: gate
on: [push, workflow_dispatch]
jobs:
  witness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: proof-of-play — the one rule a ledger has
        run: node ledger.test.mjs

      # Pinned. An unpinned gate is a gate somebody else can change.
      - name: witness — try to break the tests
        run: |
          git clone --depth 1 --branch v0.2 https://github.com/sjgant80-hub/witness.git /tmp/witness
          node /tmp/witness/witness.mjs mutate ledger.mjs \
            --cap 400 --baseline witness.ledger.baseline.json --test "node ledger.test.mjs"

      - name: the shipped page still matches the gated kernel
        run: |
          cp index.html /tmp/shipped.html
          node build-page.mjs
          diff -q /tmp/shipped.html index.html || {
            echo "::error::index.html has drifted from ledger.mjs — run build-page.mjs and commit."; exit 1; }

      # ⚑ The balance check must never go back to summing pounds with a tolerance.
      - name: no ungated arithmetic in the posting path
        run: |
          grep -q 'LEDGER.validateJournal' index.html || { echo '::error::postJournal is not using the kernel'; exit 1; }
          grep -q 'Math.abs(dr-cr)>0.005' index.html && { echo '::error::the half-penny tolerance is back'; exit 1; }
          grep -q 'if(!b)return;' index.html && { echo '::error::the trial balance is silently dropping lines again'; exit 1; }
          echo ok
